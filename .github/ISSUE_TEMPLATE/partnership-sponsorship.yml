name: Partnership & sponsorship enquiry
description: Public, non-confidential enquiry about supporting or collaborating with Global Funding Intelligence.
title: "Partnership enquiry: "
labels: ["partnership"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in Global Funding Intelligence.

        IMPORTANT: GitHub issues are PUBLIC and searchable. Do not include names,
        email addresses, telephone numbers, private contact details, confidential
        sponsor proposals, unpublished research, or other personal information.
        We can respond through this GitHub issue without collecting contact details.
        If you need a confidential discussion, request a private route here without
        posting sensitive information.

        Support does not confer influence over opportunity verification, eligibility
        assessment, source-state decisions or ranking.
  - type: input
    id: organisation
    attributes:
      label: Organisation (optional)
      description: Public organisation name only, if you are authorised to share it.
      placeholder: Public institution or organisation name
    validations:
      required: false
  - type: dropdown
    id: enquiry_type
    attributes:
      label: Enquiry type
      options:
        - Funder representation or source integration
        - Sponsorship or financial support
        - Research or institutional partnership
        - Technical, data or infrastructure partnership
        - Global Majority access or capacity-building collaboration
        - Request a private discussion channel
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Public, non-confidential summary
      description: Share only a high-level description suitable for public publication. Do not post personal data, funding amounts under negotiation, or confidential details.
      placeholder: We would like to explore a public-interest collaboration about...
    validations:
      required: true
  - type: checkboxes
    id: independence
    attributes:
      label: Independence acknowledgement
      options:
        - label: I understand that sponsorship or partnership does not influence verification, eligibility assessment, source-state decisions or ranking.
          required: true
