name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/observatory/**'
      - 'config/funder_ingestion.yaml'
      - 'requirements.txt'
      - 'scripts/live_opportunities_smoke.py'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install funding-engine dependencies
        run: pip install -r requirements.txt
      - name: Build current verified opportunity feed
        run: PYTHONPATH=src python -m observatory.publish_public_opportunities --output web/data/opportunities.json --min-records 1 --page-size 100 --html-source-limit 20
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          headers = {'User-Agent': 'PhiriLab-GFI-deployment-smoke/1.0'}
          last_error = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=20) as response:
                      html = response.read().decode('utf-8')
                  required = ('Global Funding Intelligence', 'id="opportunities"', 'opportunities.js', 'id="discover"')
                  missing = [marker for marker in required if marker not in html]
                  if missing:
                      raise RuntimeError(f'live HTML missing required markers: {missing}')
                  with urllib.request.urlopen(urllib.request.Request(base + 'data/opportunities.json', headers=headers), timeout=20) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if payload.get('schema_version') != 1:
                      raise RuntimeError('live opportunity feed schema_version is not 1')
                  opportunities = payload.get('opportunities')
                  if not isinstance(opportunities, list) or not opportunities:
                      raise RuntimeError('live opportunity feed has no structured records')
                  if payload.get('opportunity_count') != len(opportunities):
                      raise RuntimeError('live opportunity_count does not match opportunity list')
                  print(f'Live Pages verification passed: {base} ({len(opportunities)} opportunities)')
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 5:
                      raise
                  time.sleep(5)
          else:
              raise RuntimeError(f'live Pages verification failed: {last_error}')
          PY

  live-opportunities-smoke:
    name: live Opportunities browser smoke
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke dependencies
        run: |
          pip install 'playwright>=1.47,<2'
          python -m playwright install --with-deps chromium
      - name: Verify current live Opportunities in Chromium
        env:
          PAGE_URL: https://phirilab.github.io/global-funding-intelligence/
        run: python scripts/live_opportunities_smoke.py
